spring.application.name=health
server.servlet.context-path=/api

# ---------------- DATABASE ----------------
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=Pavan@1927
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP (OPTIMIZED)
spring.datasource.hikari.maximum-pool-size=200
spring.datasource.hikari.minimum-idle=50
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=2000

# ---------------- JPA ----------------
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# REMOVE THIS (auto-detected)
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hibernate Performance
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Disable Open Session in View (IMPORTANT)
spring.jpa.open-in-view=false

# ---------------- SERVER (Tomcat) ----------------
server.tomcat.threads.max=500
server.tomcat.accept-count=500
server.tomcat.max-connections=20000

# ---------------- LOGGING ----------------
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.springframework.amqp=INFO

# ---------------- RABBITMQ ----------------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Listener tuning (HIGH THROUGHPUT)
spring.rabbitmq.listener.simple.concurrency=10
spring.rabbitmq.listener.simple.max-concurrency=50
spring.rabbitmq.listener.simple.prefetch=50
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=2

# Publisher (VERY IMPORTANT)
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# RPC Optimization
spring.rabbitmq.template.reply-timeout=10000
spring.rabbitmq.template.mandatory=true

# Connection tuning
spring.rabbitmq.cache.channel.size=50
spring.rabbitmq.cache.connection.mode=channel

# ---------------- ACTUATOR (OPTIONAL BUT POWERFUL) ----------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always